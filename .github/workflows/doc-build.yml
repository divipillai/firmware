name: Documentation Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      documentation_tag:
        type: string
        required: false
        default: "latest"
        description: "Label of the documentation"
      publish_to_prod:
        type: boolean
        default: true
      publish_to_dev:
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - '.github/workflows/doc-build.yml'
      - '.github/workflows/doc-publish.yml'
      - '**.rst'
      - 'docs/**'
      - "include/**"
  push:
    branches:
      - main

  workflow_call:
    inputs:
      documentation_tag:
        type: string
        required: true
        default: "latest"
      publish_to_prod:
        type: boolean
        default: true
      publish_to_dev:
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12
          cache: pip
          cache-dependency-path: docs/requirements.txt
          pip-install: |
            -r docs/requirements.txt

      - name: Build
        working-directory: docs
        run: |
          sphinx-build -M html . build

      - name: Prepare Azure upload
        run: |
          PUBLISH="$PWD/publish"
          mkdir -p "$PUBLISH"

          MONITOR="monitor_${{ github.run_id }}.txt"

          # Create documentation upload files
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ARCHIVE="legacy-addon-thingy91x_oob-pr-${{ github.event.number }}.zip"
            echo "publish2 dev PR-${{ github.event.number }} ${ARCHIVE}" > "${MONITOR}"
            echo "${{ github.event.number }}" > pr.txt
          else
            ARCHIVE="legacy-addon-addon-thingy91x_oob-${{inputs.documentation_tag}}.zip"
            echo "publish2 main ${{inputs.documentation_tag}} ${ARCHIVE}" > "${MONITOR}"
          fi

          pushd "docs/build/html"
          zip -rq "${ARCHIVE}" .
          mv "${ARCHIVE}" "$PUBLISH"
          popd

          mv "${MONITOR}" "$PUBLISH"
          if [[ -f pr.txt ]]; then mv pr.txt "$PUBLISH"; fi

      - name: Prepare Zoomin upload
        if: ${{ github.event_name == 'push' }}
        run: |
          PUBLISH="$PWD/publish"
          mkdir -p "$PUBLISH"

          OUTDIR=docs/build/html
          ARCHIVE="addon-thingy91x_oob_${{inputs.documentation_tag}}.zip"

          cp docs/custom.properties "$OUTDIR/custom.properties"
          sed -i 's/__VERSION__/'"${{inputs.documentation_tag}}"'/g' "$OUTDIR/custom.properties"

          cp docs/tags.yml "$OUTDIR/tags.yml"
          sed -i 's/__VERSION__/'"${{inputs.documentation_tag}}"'/g "$OUTDIR/tags.yml"

          pushd "$OUTDIR"
          zip -rq "$ARCHIVE" .
          mv "$ARCHIVE" "$PUBLISH"
          popd

      - name: Store
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'external') || contains(github.event.pull_request.labels.*.name, 'CI-trusted-author') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docs
          retention-days: 5
          path: |
            publish/*
